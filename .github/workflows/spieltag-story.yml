name: Spieltag-Story

on:
  schedule:
    # Morgens alle Spiele des Tages schicken, danach läuft der Bot bis 23 Uhr.
    # Drei Weckzeiten, weil GitHub geplante Läufe manchmal auslässt. Der erste erledigt es,
    # die anderen sehen in status/morgen.txt, dass schon geschickt wurde.
    # (UTC: 5:00 = 7 Uhr Sommerzeit / 6 Uhr Winterzeit)
    - cron: '0 5 * * *'
    - cron: '30 5 * * *'
    - cron: '0 6 * * *'
    - cron: '30 4 * * 1'   # montags Instagram-Token verlängern
  workflow_dispatch:
    inputs:
      befehl:
        description: 'Was soll laufen?'
        type: choice
        options: [morgen, bot, freigaben, token]
        default: morgen
      datum:
        description: 'Nur bei „morgen“: Tag im Format JJJJ-MM-TT (leer = heute)'
        required: false

permissions:
  contents: write   # Status-Dateien committen
  actions: write    # nächsten Bot-Lauf starten

# Nie zwei Läufe gleichzeitig, sonst würden Knopfdrücke doppelt verarbeitet.
concurrency:
  group: spieltag-story
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub-Maximum sind 360; der Bot beendet sich nach 5:40 Stunden selbst
    env:
      KIE_AI_API_KEY: ${{ secrets.KIE_AI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Befehl bestimmen
        id: befehl
        env:
          ZEITPLAN: ${{ github.event.schedule }}
          EINGABE: ${{ inputs.befehl }}
        run: |
          case "$ZEITPLAN" in
            '30 4 * * 1') echo "befehl=token" >> "$GITHUB_OUTPUT" ;;
            '')           echo "befehl=$EINGABE" >> "$GITHUB_OUTPUT" ;;
            *)            echo "befehl=morgen" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow installieren
        run: pip install -r requirements.txt

      - name: Ausführen
        env:
          BEFEHL: ${{ steps.befehl.outputs.befehl }}
          DATUM: ${{ inputs.datum }}
        run: python lauf.py "$BEFEHL" $DATUM

      - name: Neuen Instagram-Token als Secret speichern
        if: always() && hashFiles('status/neuer_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set INSTAGRAM_TOKEN < status/neuer_token
          else
            echo "::warning::Neuer Instagram-Token, aber kein GH_PAT-Secret zum Speichern"
          fi
          rm status/neuer_token

      - name: Status sichern
        if: always()
        run: |
          git config user.name "spieltag-story"
          git config user.email "actions@users.noreply.github.com"
          git add status/gepostet.txt status/morgen.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Status aktualisiert"
            git pull --rebase --quiet && git push
          fi

      - name: Nächsten Bot-Lauf starten
        if: always() && hashFiles('status/weiter') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run spieltag-story.yml --ref main -f befehl=bot
